<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Overlight">
<title>Overlight</title>
<style>
/* Layout: one full-bleed canvas. Every visual, text included, is drawn as glowing vector strokes on true black. */
:root{
  --void:#000000;   /* arena background */
  --volt:#19e6ff;   /* arena edges, player ship */
  --plasma:#ff2bd6; /* energy spheres, wave banners */
  --spark:#ffe81a;  /* flamethrower, score accents */
  --alarm:#ff2442;  /* mines, spawn warnings */
  --font-fallback: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; /* only for <noscript>; in-game text is a stroke font */
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden;overscroll-behavior:none;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:block;outline:none;background:var(--void);touch-action:none}
#cv.aim{cursor:none}
#safe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
noscript{position:fixed;inset:0;display:grid;place-items:center;color:var(--volt);font-family:var(--font-fallback);padding-inline:16px;text-align:center}
</style>
</head>
<body>
<script>
/* Start the Playgama Bridge first, before any game code, so the platform / QA tool always receives the
   initialization message even if something later fails. */
window.__pgInit = (function () {
  try {
    if (window.bridge && typeof window.bridge.initialize === 'function') {
      return window.bridge.initialize().then(function () { return true; }, function (e) { if (window.console) console.error('Bridge init failed', e); return false; });
    }
  } catch (e) { if (window.console) console.error('Bridge init error', e); }
  return Promise.resolve(false);
})();
</script>
<div id="safe"></div>
<canvas id="cv" tabindex="0" aria-label="Overlight, a neon twin-stick shooter on a wireframe planet. Click or press Enter to start."></canvas>
<noscript>Overlight needs JavaScript to run.</noscript>

/* palette (rgb triplets so alpha can vary per stroke) */

  ora: [255, 140, 30], red: [255, 36, 66], ice: [95, 205, 255], white: [255, 255, 255], violet: [176, 96, 255], green: [70, 255, 150],

/* phones: equal glow for every colour. Light colours (yellow, white, green, cyan) shine far more than red

const lin = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };

/* interface text: lighter tints that stay readable on the dark planet (never dimmed on phones) */

C.uiMag.k = 1; C.uiBlue.k = 1;
C.barMag = [235, 50, 200]; C.barMag.k = 1;
C.mer = [255, 150, 40]; C.merUI = [255, 196, 120]; C.merBar = [245, 135, 30]; C.merUI.k = 1; C.merBar.k = 1;

function glowK(c) {

const rgba = (c, a) => { a *= glowK(c); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(3) + ')'; };

/* =====================================================================
   PLANET + CAMERA
   The arena is a wireframe sphere. Everything lives on its surface as a unit
   normal (nx, ny, nz) plus a height h above the ground. The camera hovers
   over the ship and follows it, so the planet turns under you as you fly.
   ===================================================================== */
const R = 720, CAMD = R * 3.2, HMAX = CAMD - R - 140;
let devPx = null;   // [w, h]: the screen pixels the canvas covers, from a ResizeObserver (where the browser can tell)
let pxCapLow = false;   // true once a slow computer has gone back to the lower resolution cap
let F = 1100, S0 = 0.7, RS = 350, CX = 0, CY = 0, VW = 1, VH = 1, DPR = 1, FS = 14;
let hudTop = 50, hudBot = 44, availW = 800, availH = 600;
let shakeX = 0, shakeY = 0;
/* camera frame: N points from the planet centre toward the viewer, U is screen-up, R is screen-right */
const cam = { nx: 0, ny: 0, nz: 1, ux: 0, uy: 1, uz: 0, rx: 1, ry: 0, rz: 0 };

function proj3(nx, ny, nz, h) {

  const Y = (nx * cam.ux + ny * cam.uy + nz * cam.uz) * r;

function projO(o, h) { proj3(o.nx, o.ny, o.nz, h); }

/* sphere helpers (results in module variables to avoid allocations) */
let tx = 0, ty = 0, tz = 0, b1x = 1, b1y = 0, b1z = 0, b2x = 0, b2y = 1, b2z = 0;

/* =====================================================================

/* =====================================================================
   PLANET GRID: latitude/longitude wireframe whose nodes ripple with impacts
   ===================================================================== */
const GL = 24, GM = 48, GN = (GL - 1) * GM;
const G = {
  bx: new Float32Array(GN), by: new Float32Array(GN), bz: new Float32Array(GN),
  ox: new Float32Array(GN), oy: new Float32Array(GN), oz: new Float32Array(GN),
  vx: new Float32Array(GN), vy: new Float32Array(GN), vz: new Float32Array(GN),
  sx: new Float32Array(GN), sy: new Float32Array(GN), vis: new Uint8Array(GN)

for (let j = 1; j < GL; j++) {
  const lat = -Math.PI / 2 + j * Math.PI / GL, cl = Math.cos(lat), sl = Math.sin(lat);
  for (let i = 0; i < GM; i++) {
    const lon = i * TAU / GM, id = (j - 1) * GM + i;
    G.bx[id] = cl * Math.cos(lon); G.by[id] = sl; G.bz[id] = cl * Math.sin(lon);
  }
}
function gridImpulse(o, force, rad) {
  const qx = o.nx, qy = o.ny, qz = o.nz, cl = 1 - (rad / R) * (rad / R) * 0.5 - 0.02;

    const bx = G.bx[id], by = G.by[id], bz = G.bz[id];
    if (bx * qx + by * qy + bz * qz < cl) continue;
    let dx = bx + G.ox[id] / R - qx, dy = by + G.oy[id] / R - qy, dz = bz + G.oz[id] / R - qz;
    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz) * R;
    if (dist >= rad) continue;
    const d = dx * bx + dy * by + dz * bz; dx -= bx * d; dy -= by * d; dz -= bz * d;
    const l = Math.hypot(dx, dy, dz); if (l < 1e-9) continue;

    G.vx[id] += dx * f; G.vy[id] += dy * f; G.vz[id] += dz * f;

}

  const k = 55, c = 5.5, kn = 26;
  for (let j = 1; j < GL; j++) for (let i = 0; i < GM; i++) {
    const row = (j - 1) * GM, id = row + i, il = row + (i + GM - 1) % GM, ir = row + (i + 1) % GM;
    let sx = G.ox[il] + G.ox[ir], sy = G.oy[il] + G.oy[ir], sz = G.oz[il] + G.oz[ir];
    if (j + 1 < GL) { sx += G.ox[id + GM]; sy += G.oy[id + GM]; sz += G.oz[id + GM]; }
    if (j > 1) { sx += G.ox[id - GM]; sy += G.oy[id - GM]; sz += G.oz[id - GM]; }
    G.vx[id] += (-k * G.ox[id] - c * G.vx[id] + kn * (sx * 0.25 - G.ox[id])) * dt;
    G.vy[id] += (-k * G.oy[id] - c * G.vy[id] + kn * (sy * 0.25 - G.oy[id])) * dt;
    G.vz[id] += (-k * G.oz[id] - c * G.vz[id] + kn * (sz * 0.25 - G.oz[id])) * dt;
  }
  for (let id = 0; id < GN; id++) {
    const bx = G.bx[id], by = G.by[id], bz = G.bz[id];
    let ox = G.ox[id] + G.vx[id] * dt, oy = G.oy[id] + G.vy[id] * dt, oz = G.oz[id] + G.vz[id] * dt;
    let d = ox * bx + oy * by + oz * bz; ox -= bx * d; oy -= by * d; oz -= bz * d;
    const l = Math.hypot(ox, oy, oz); if (l > 45) { ox *= 45 / l; oy *= 45 / l; oz *= 45 / l; }

  }
}

  uiButton(x - s / 2, y - s / 2, s, s, '', col, fireUlt, { selected: full, dim: !full });
  const rr = r * 0.88;
  ctx.beginPath(); circle(x, y, rr); glow(col, 1, full ? 0.6 : 0.25, false);
  if (k > 0) { ctx.beginPath(); ctx.arc(x, y, rr, -Math.PI / 2, -Math.PI / 2 + k * TAU); glow(full ? C.white : col, 2.6, pulse, false); }
  ctx.beginPath(); iconPath(weapon, x, y, rr / 30 * 0.95, 0); glow(full ? mix(col, C.white, 0.35) : col, 1.4, full ? 1 : 0.5, false);
  const ls = Math.max(8, FS * 0.5);
  if (padMode) { const gs = Math.max(16, FS * 1.05); padGlyph('Y', x, y - s / 2 - gs * 0.1, gs, full ? pulse : 0.6); }   // 18/10: its controller key, always shown
  else if (full) vtext(touchUI ? 'TAP' : 'SPACE', x, y - s / 2 - ls * 1.1, ls, C.white, { alpha: pulse, track: 0.15, hot: false });
  if (full && tut && tutStep().title === 'ULTIMATE READY') {   // tutorial: make it impossible to miss
    for (let i = 0; i < 2; i++) { const f = (T * 1.4 + i * 0.5) % 1; ctx.beginPath(); circle(x, y, s * (0.6 + f * 0.9)); glow(C.yel, 2.4, 1 - f, false); }
    if (Math.floor(T * 6) % 2) { ctx.beginPath(); ctx.rect(x - s / 2 - 3, y - s / 2 - 3, s + 6, s + 6); glow(C.yel, 2, 1, false); }
  }
}

/* =====================================================================
   META GAME: profile (coins, purchases, unlocks), difficulties, checkpoints, coins on the map,
   ads (Playgama Bridge, or a simulated video offline), new weapons, skins, menu and shop.
   ===================================================================== */
const SAVE_KEY = 'overlight_save';
const profile = readProfile();
function readProfile() {
  let p = null; try { const raw = store.get(SAVE_KEY, 'null'); p = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch (e) {}
  const d = { coins: 0, owned: { ship_classic: 1, planet_neon: 1, w_flame: 1, w_ice: 1, w_orb: 1 }, ship: 'classic', planet: 'neon',
    cp: [0, 0, 0, 0], best: [0, 0, 0, 0], wins: [0, 0, 0, 0], diff: 0, loadout: ['flame', 'ice', 'orb'] };
  const out = Object.assign(d, p || {});
  if (p && !p.econ) out.coins = Math.round((out.coins || 0) * 10);   // 13/10: every price and reward became 10x bigger
  out.econ = 2;
  return out;
}
function saveProfile() { store.set(SAVE_KEY, JSON.stringify(profile)); }

const LANG_IX = { de: 0, fr: 1, it: 2, pt: 3, es: 4, ru: 5, tr: 6 };
var lang = 'en', txCache = new Map();
let TX_NAMES = null;   // proper names kept as they are (and filled back into templates)
function txNames() {
  if (TX_NAMES) return TX_NAMES;
  const set = new Set(['PLANET HEART', 'BASTION', 'MERIDIAN', 'MITOSIS', 'ECLIPSE', 'LEVIATHAN', 'HYDRA', 'NORMAL', 'HARD', 'NIGHTMARE', 'OVERLIGHT']);
  for (const k in WEAPONS) set.add(WEAPONS[k].name);
  for (const k in ULT_NAME) set.add(ULT_NAME[k]);
  for (const k in FOE_NAME) set.add(FOE_NAME[k]);
  for (const sk of SHIP_SKINS) set.add(sk.name);
  for (const sk of PLANET_SKINS) set.add(sk.name);
  const list = [...set].sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  return (TX_NAMES = new RegExp('(^|[^A-Z])(' + list.join('|') + ')(?![A-Z])', 'g'));   // whole words only (HARD is not in HARDER)
}
function txl(str) {
  if (typeof str === 'string' && str.charCodeAt(0) === 2) return str.slice(1);   // 19/10: marked raw (a player's name): as it is
  if (!lang || lang === 'en' || typeof str !== 'string' || !/[A-Z]/.test(str)) return str;
  let out = txCache.get(str);
  if (out !== undefined) return out;
  const ix = LANG_IX[lang], hit = I18N[str];
  if (hit) out = hit[ix];
  else {
    // templates: proper names -> @, numbers -> #
    const names = [], nums = [];
    let key = str.replace(txNames(), (m, pre, n) => { names.push(n); return pre + '\u0001' + (names.length - 1) + '\u0001'; });
    const order = []; key = key.replace(/\u0001(\d+)\u0001/g, (m, i) => { order.push(names[+i]); return '@'; });   // names in order of appearance
    key = key.replace(/\d[\d,.]*/g, m => { nums.push(m.replace(/\.$/, '')); return '#' + (m.endsWith('.') ? '.' : ''); });
    const t = I18N[key];
    if (t) { let a = 0, b = 0; out = t[ix].replace(/[@#]/g, c => c === '@' ? txl(order[a++] || '') : (nums[b++] || '')); }
    else out = str;
  }
  if (txCache.size > 4000) txCache.clear();
  txCache.set(str, out);
  return out;
}
function pickLang(code) { code = String(code || '').toLowerCase().slice(0, 2); return LANGS.indexOf(code) >= 0 ? code : null; }

  setLang(code);
}

/* ---------- the run: checkpoints, snapshots, rewards ---------- */
let run = null, pendingFrom = 1, pendingResume = null;
function newRun() { return { clean: true, continued: false, coins: 0, maxWave: 0, paidWave: 0, waveSnap: null, bossSnap: null, lastEarned: 0, doubled: false, gift: null }; }

}

/* ---------- coin economy (13/10, everything x10 and more generous) ----------
   kills: about a seventh of their score value, straight into the run total (no pickup);
   every new wave reached: 40 + 10 per wave number; each boss beaten: 300 per boss (300, 600, 900, 1200); winning: 3000.
   The whole run is then multiplied by the difficulty. A full NORMAL run is about 23,000 coins. */
const ECON = { killDiv: 7, waveBase: 40, wavePer: 10, boss: 300, victory: 3000 };
function waveReward(w) { return ECON.waveBase + ECON.wavePer * w; }
function creditRun(victory) {
  if (tut) { run.coins = 0; run.lastEarned = 0; return 0; }   // the tutorial pays nothing
  const top = Math.max(run.maxWave, wave);
  let waveBonus = 0; for (let w = run.paidWave + 1; w <= top; w++) waveBonus += waveReward(w);
  run.paidWave = Math.max(run.paidWave, top);
  const earned = Math.round((run.coins + waveBonus + (victory ? ECON.victory : 0)) * DIFF.mul);
  run.coins = 0; profile.coins += earned; run.lastEarned = earned; run.doubled = false;

  // from before the penalty, so retrying again does not count it twice
  run.penalty = 0;

  if (run.clean && score > profile.best[diffIdx]) { profile.best[diffIdx] = score; newBest = true; }
  if (run.clean) LB.submit(diffIdx, score);   // 19/10: the leaderboard of this difficulty
  saveProfile();

}

/* the ring ship */
function drawHaloShip(x, y, ang, s, alpha, sk, lw) {
  const R = 21 * s, r = 12 * s;
  ctx.beginPath(); ctx.arc(x, y, R, 0, TAU); glowSoft(sk.col, lw, alpha);
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); glowSoft(sk.col, lw * 0.6, alpha * 0.8);
  // struts between the two rings, turning slowly
  ctx.beginPath();
  for (let i = 0; i < 6; i++) { const q = T * 0.6 + i * TAU / 6; ctx.moveTo(x + Math.cos(q) * r, y + Math.sin(q) * r); ctx.lineTo(x + Math.cos(q) * R, y + Math.sin(q) * R); }
  glowSoft(sk.col, lw * 0.45, alpha * 0.55);
  // running lights round the rim, the other way
  for (let i = 0; i < 8; i++) {
    const q = -T * 2.2 + i * TAU / 8, on = (Math.floor(T * 6) + i) % 4 === 0;
    fillDot(x + Math.cos(q) * (R + r) / 2, y + Math.sin(q) * (R + r) / 2, (on ? 2.6 : 1.7) * s, on ? C.white : sk.acc, alpha * (on ? 1 : 0.8));
  }
}
/* a ship scaled and centred to fit a box (shop tiles): long or wide skins are shrunk to fit, short ones are not blown up past the classic size */
function skinExtent(sk) {

    for (const set of [[sk.shape], sk.parts || [], sk.lines || []]) for (const pts of set) for (const [x, y] of pts) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y1 = Math.max(y1, Math.abs(y)); }
  }
  return (sk._ext = { x0, x1, y1 });
}
function drawSkinPreview(cx, cy, H, W, ang, alpha, sk) {

  drawSkinShip(cx - Math.cos(ang) * mid * s, cy - Math.sin(ang) * mid * s, ang, s, alpha, sk);
}

  if (e.code === 'Enter' || e.code === 'NumpadEnter') { if (state === 'title' || state === 'over' || state === 'victory' || state === 'revive' || paused) confirmAction(); }
  if (e.code === 'Escape' && state === 'revive' && !ADS.overlay) gameOver();
  else if (e.code === 'Space' && (state === 'title' || ((state === 'over' || state === 'victory') && stateT > 1))) confirmAction();
  else if (e.code === 'Space' || e.code === 'KeyE') fireUlt();
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (inPlay()) setPaused(!paused); }
  else if (e.code === 'KeyR' && paused) restartGame();
  else if (e.code === 'KeyM') toggleMute();
  else if (e.code === 'KeyF') toggleFullscreen();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; if (inPlay()) setPaused(true); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden && inPlay()) setPaused(true);
  if (!document.hidden) { last = performance.now(); if (!PG.intOpen && !PG.rwOpen) releaseAfterAd(); }
  syncAudio();
});
/* some platforms send 'pause' when an ad opens but never 'resume' afterwards: 600 ms after an ad closes we resume ourselves */
let releaseTimer = null;
function releaseAfterAd() {
  clearTimeout(releaseTimer);
  releaseTimer = setTimeout(() => {
    if (PG.intOpen || PG.rwOpen || document.hidden) return;
    PG.extPaused = false; PG.audioOn = true; last = performance.now(); syncAudio(); autoResume();
  }, 600);
}
function autoResume() { if (!PG.autoPaused) return; PG.autoPaused = false; if (paused && inPlay()) setPaused(false); }
/* the player is touching the game: nothing is covering it, never stay frozen */
function wakeUp() {
  if (!pgFrozen() || document.hidden) return;
  PG.extPaused = false; PG.intOpen = false; PG.rwOpen = false; last = performance.now(); syncAudio();
}
window.addEventListener('pointerdown', wakeUp, true);
window.addEventListener('keydown', wakeUp, true);

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  unlockAudio();
  try { cv.focus({ preventScroll: true }); } catch (_) {}
  const [x, y] = toGame(e);
  if (e.pointerType === 'touch') touchUI = true; else if (e.pointerType === 'mouse') touchUI = false;
  nav.on = false; padMode = false;
  if (ADS.overlay || ADS.busy) return;
  for (const b of uiButtons) if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) {
    if (!shopTutAllows(b)) continue;   // shop tour: only the highlighted thing works
    pressFx = { x: b.x, y: b.y, w: b.w, h: b.h, t: 0.22 }; b.act(); SFX.ui(); return;
  }
  if (paused) return;   // while paused only the RESUME / RESTART buttons respond
  if (e.button !== 2 && tutContinue()) return;   // tutorial: the reading steps go on with a click or a tap
  if (state === 'title' || state === 'over' || state === 'victory' || state === 'revive') return;   // menus: only their buttons
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  if (e.pointerType === 'touch') {
    const st = x < VW / 2 ? sticks.L : sticks.R;
    if (st.id === null) { st.id = e.pointerId; st.ox = st.x = x; st.oy = st.y = y; }
  } else {
    mouse.x = x; mouse.y = y; mouse.seen = true; aimMode = 'mouse';
    if (e.button === 0) mouse.down = true;
    else if (e.button === 2) fireUlt();   // right click: ultimate
  }
});
cv.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') {
    const [gx, gy] = toGame(e);
    for (const k of ['L', 'R']) if (sticks[k].id === e.pointerId) { sticks[k].x = gx; sticks[k].y = gy; }
  } else {
    const [gx, gy] = toGame(e);
    if (Math.abs(gx - mouse.x) + Math.abs(gy - mouse.y) > 2) { aimMode = 'mouse'; nav.on = false; padMode = false; }
    mouse.x = gx; mouse.y = gy; mouse.seen = true;
  }
});
function pointerEnd(e) {
  if (e.pointerType === 'touch') { for (const k of ['L', 'R']) if (sticks[k].id === e.pointerId) sticks[k].id = null; }
  else if (e.button === 0 || e.type === 'pointercancel') mouse.down = false;
}
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', resize);
// 19/10: back to fullscreen after an ad (needs a tap, a click or a key). On touch screens a tap only counts for the browser
// when the finger lifts (pointerup / touchend), not when it lands, so those are listened to as well
window.addEventListener('pointerdown', fsBackTap, true);
window.addEventListener('pointerup', fsBackTap, true);
window.addEventListener('touchend', fsBackTap, true);
window.addEventListener('keydown', fsBackTap, true);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
document.addEventListener('fullscreenchange', () => setTimeout(resize, 120));
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
try {   // 19/10: the canvas size in real screen pixels (Chrome, Edge, Firefox; Safari lacks it and keeps the rounded size)
  new ResizeObserver(es => {
    for (const e of es) {
      const b = e.devicePixelContentBoxSize && e.devicePixelContentBoxSize[0];
      if (b && (!devPx || devPx[0] !== b.inlineSize || devPx[1] !== b.blockSize)) { devPx = [b.inlineSize, b.blockSize]; resize(); }
    }
  }).observe(cv, { box: 'device-pixel-content-box' });
} catch (e) {}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - last) / 1000; last = now;
  if (!(rdt >= 0)) rdt = 0; if (rdt > 0.1) rdt = 0.1;
  try { step(rdt); render(); } catch (err) { if (window.console) console.error(err); }
}
camOrtho();
resize();
initLang();
requestAnimationFrame(t => { last = t; frame(t); });
/* =====================================================================
   PLAYGAMA BRIDGE: initialize (started in the first script of the page), platform language, saves in
   bridge.storage, pause / audio events, ad states, game_ready. Without the SDK the game runs offline.
   ===================================================================== */
function initPlatform() {
  const b = window.bridge;
  if (!b || typeof b.initialize !== 'function') return Promise.resolve(false);
  const timeout = new Promise(r => setTimeout(() => r(false), 8000));
  const init = window.__pgInit || b.initialize().then(() => true);
  return Promise.race([init, timeout]).then(ok => {
    if (!ok) return false;
    const p = b.platform, a = b.advertisement, E = b.EVENT_NAME;
    PG.on = true;
    PG.lang = p.language || '';
    PG.audioOn = p.isAudioEnabled !== false;
    PG.intOpen = a.interstitialState === 'opened';
    p.on(E.AUDIO_STATE_CHANGED, on => { PG.audioOn = !!on; syncAudio(); });
    // 19/10: a pause the platform asked for (an ad, the tab hidden) ends by itself; a pause the player chose stays
    p.on(E.PAUSE_STATE_CHANGED, v => { PG.extPaused = !!v; if (v && inPlay() && !paused) { setPaused(true); PG.autoPaused = true; } else if (!v) autoResume(); syncAudio(); });
    a.on(E.INTERSTITIAL_STATE_CHANGED, st => { PG.intOpen = st === 'opened'; syncAudio(); if (st === 'closed' || st === 'failed') releaseAfterAd(); });
    a.on(E.REWARDED_STATE_CHANGED, st => { PG.rwOpen = st === 'opened'; syncAudio(); if (st === 'closed' || st === 'failed') releaseAfterAd(); });
    try { if (a.checkAdBlock) a.checkAdBlock().then(r => { PG.adBlock = !!r; }).catch(() => {}); } catch (e) {}
    return true;
  }).catch(() => false);
}
function loadSaves() {
  if (!PG.on) return Promise.resolve();
  let q; try { q = window.bridge.storage.get(SAVE_KEYS); } catch (e) { return Promise.resolve(); }
  return Promise.resolve(q).then(d => {
    const arr = Array.isArray(d) ? d : [d];
    SAVE_KEYS.forEach((k, i) => { let v = arr[i]; if (v !== null && v !== undefined && typeof v !== 'string') v = JSON.stringify(v); store.mem[k] = v === undefined ? null : v; });
    // the saves arrived: everything read at start-up is read again
    const P = readProfile(); for (const k of Object.keys(profile)) delete profile[k]; Object.assign(profile, P);
    best = parseInt(store.get('overlight_best', '0'), 10) || 0;
    muted = store.get('overlight_muted', '0') === '1';
    diffIdx = clamp(profile.diff | 0, 0, 3); DIFF = DIFFS[diffIdx];
  }).catch(() => {});
}
initPlatform().then(loadSaves).catch(() => {}).then(() => {
  bootReady = true;
  initLang();
  syncAudio();
  if (!profile.tutDone && state === 'title') startTutorial(true);   // the very first time: straight into the tutorial
  requestAnimationFrame(() => requestAnimationFrame(() => pgMsg('game_ready')));   // the first playable frame is on screen
});
})();
</script>
