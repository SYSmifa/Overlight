name: APK di prova (Android)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['www/**', 'capacitor.config.json', 'package.json', 'scripts/**', 'icon/**', 'game/**', 'app/**', '.github/workflows/android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Genera il progetto Android
        run: bash scripts/make-android.sh
      - name: Compila l'APK di debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: overlight-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
