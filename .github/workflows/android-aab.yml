name: AAB per Google Play
on:
  workflow_dispatch:
    inputs:
      live_ads:
        description: 'Annunci REALI (solo per la versione da pubblicare in produzione)'
        type: boolean
        default: false
      version_name:
        description: 'Nome della versione'
        default: '1.0'
      experiments:
        description: 'SOLO PROVE: costruisce due APK di prova (A e B) per cercare il rallentamento'
        type: boolean
        default: false
      debuggable:
        description: 'SOLO PROVE: release marcata debuggable (Google Play la rifiuta)'
        type: boolean
        default: false

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name }}
      DEBUGGABLE_RELEASE: ${{ inputs.debuggable && '1' || '0' }}
      OVERLIGHT_LIVE_ADS: ${{ inputs.live_ads && '1' || '0' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Chiave di firma
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Mancano i segreti della chiave: l'AAB sara' NON firmato (solo prova di compilazione, Google Play lo rifiutera')."
          fi
      - name: Genera il progetto Android
        run: bash scripts/make-android.sh
      - name: Compila l'AAB di release
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Compila anche un APK di release (per provare l'app senza passare da Play)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNED != '1' && 'overlight-apk-NON-FIRMATO' || (inputs.debuggable && 'overlight-apk-release-DEBUGGABLE' || 'overlight-release-apk') }}
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNED != '1' && 'overlight-aab-NON-FIRMATO' || (inputs.debuggable && 'overlight-aab-DEBUGGABLE-NON-CARICARE' || 'overlight-release-aab') }}
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Prove E e F (solo se richieste)
        if: ${{ inputs.experiments }}
        working-directory: android
        run: |
          ASSETS=app/src/main/assets
          mkdir -p ../variants
          cp $ASSETS/public/index.html /tmp/index.orig.html
          sed -i "s#try { await P.initialize({}); }#return; try { await P.initialize({}); }#" $ASSETS/public/index.html
          cp $ASSETS/public/index.html /tmp/index.base.html
          # E: solo requestConsentInfo, senza mai mostrare il modulo
          grep -q "i.status === 'REQUIRED') {" $ASSETS/public/index.html
          sed -i "s#i.status === 'REQUIRED') {#i.status === 'REQUIRED' \&\& false) {#" $ASSETS/public/index.html
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../variants/E-solo-richiesta-info.apk
          cp /tmp/index.base.html $ASSETS/public/index.html
          # F: consenso come C ma partenza ritardata di 20 secondi
          grep -q "am.start = async () => {" $ASSETS/public/index.html
          sed -i "s#am.start = async () => {#am.start = async () => { await new Promise(r => setTimeout(r, 20000));#" $ASSETS/public/index.html
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../variants/F-consenso-dopo-20s.apk
          cp /tmp/index.orig.html $ASSETS/public/index.html
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.experiments }}
        with:
          name: overlight-prove-E-F
          path: variants/*.apk
