name: AAB per Google Play
on:
  workflow_dispatch:
    inputs:
      live_ads:
        description: 'Annunci REALI (solo per la versione da pubblicare in produzione)'
        type: boolean
        default: false
      version_name:
        description: 'Nome della versione'
        default: '1.0'
      experiments:
        description: 'SOLO PROVE: costruisce due APK di prova (A e B) per cercare il rallentamento'
        type: boolean
        default: false
      debuggable:
        description: 'SOLO PROVE: release marcata debuggable (Google Play la rifiuta)'
        type: boolean
        default: false

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name }}
      DEBUGGABLE_RELEASE: ${{ inputs.debuggable && '1' || '0' }}
      OVERLIGHT_LIVE_ADS: ${{ inputs.live_ads && '1' || '0' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Chiave di firma
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Mancano i segreti della chiave: l'AAB sara' NON firmato (solo prova di compilazione, Google Play lo rifiutera')."
          fi
      - name: Genera il progetto Android
        run: bash scripts/make-android.sh
      - name: Compila l'AAB di release
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Compila anche un APK di release (per provare l'app senza passare da Play)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNED != '1' && 'overlight-apk-NON-FIRMATO' || (inputs.debuggable && 'overlight-apk-release-DEBUGGABLE' || 'overlight-release-apk') }}
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNED != '1' && 'overlight-aab-NON-FIRMATO' || (inputs.debuggable && 'overlight-aab-DEBUGGABLE-NON-CARICARE' || 'overlight-release-aab') }}
          path: android/app/build/outputs/bundle/release/app-release.aab
      - name: Prove A e B (solo se richieste)
        if: ${{ inputs.experiments }}
        working-directory: android
        run: |
          ASSETS=app/src/main/assets
          mkdir -p ../variants
          cp $ASSETS/capacitor.config.json /tmp/capacitor.config.orig.json
          cp $ASSETS/public/index.html /tmp/index.orig.html
          # A: debug del contenuto web attivo (come in una app debuggable), app NON debuggable
          python3 - <<'PY'
          import json
          p = 'app/src/main/assets/capacitor.config.json'
          c = json.load(open(p)); c.setdefault('android', {})['webContentsDebuggingEnabled'] = True
          json.dump(c, open(p, 'w'))
          PY
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../variants/A-webdebug.apk
          cp /tmp/capacitor.config.orig.json $ASSETS/capacitor.config.json
          # B: niente AdMob (ne' consenso ne' annunci), app NON debuggable
          grep -q 'if (AM.start) AM.start();' $ASSETS/public/index.html
          sed -i 's#if (AM.start) AM.start();##' $ASSETS/public/index.html
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/*.apk ../variants/B-noads.apk
          cp /tmp/index.orig.html $ASSETS/public/index.html
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.experiments }}
        with:
          name: overlight-prove-A-B
          path: variants/*.apk
