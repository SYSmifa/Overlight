name: AAB per Google Play
on:
  workflow_dispatch:
    inputs:
      live_ads:
        description: 'Annunci REALI (solo per la versione da pubblicare in produzione)'
        type: boolean
        default: false
      version_name:
        description: 'Nome della versione'
        default: '1.0'

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ inputs.version_name }}
      OVERLIGHT_LIVE_ADS: ${{ inputs.live_ads && '1' || '0' }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Chiave di firma
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::Mancano i segreti della chiave: l'AAB sara' NON firmato (solo prova di compilazione, Google Play lo rifiutera')."
          fi
      - name: Genera il progetto Android
        run: bash scripts/make-android.sh
      - name: Compila l'AAB di release
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Compila anche un APK di release (per provare l'app senza passare da Play)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNED == '1' && 'overlight-release-apk' || 'overlight-apk-NON-FIRMATO' }}
          path: android/app/build/outputs/apk/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SIGNED == '1' && 'overlight-release-aab' || 'overlight-aab-NON-FIRMATO' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
